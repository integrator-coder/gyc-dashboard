services:
  - type: web
    name: gyc-dashboard
    runtime: node
    region: ohio
    plan: starter
    nodeVersion: "20.x"
    buildCommand: npm ci && npm run build
    startCommand: node node_modules/.bin/next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_APP_NAME
        value: GYC Dashboard
