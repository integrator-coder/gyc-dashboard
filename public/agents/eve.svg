<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <rect width="80" height="80" rx="16" fill="#020d18"/>
  <!-- Body - sleek orb shape -->
  <ellipse cx="40" cy="44" rx="22" ry="16" fill="#0c4a6e"/>
  <ellipse cx="40" cy="44" rx="22" ry="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="40" cy="26" rx="17" ry="13" fill="#0ea5e9"/>
  <ellipse cx="40" cy="26" rx="17" ry="13" fill="none" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Eyes - cyan glow -->
  <ellipse cx="32" cy="25" rx="6" ry="4" fill="#0f172a"/>
  <ellipse cx="32" cy="25" rx="4" ry="2.5" fill="#38bdf8"/>
  <ellipse cx="48" cy="25" rx="6" ry="4" fill="#0f172a"/>
  <ellipse cx="48" cy="25" rx="4" ry="2.5" fill="#38bdf8"/>
  <!-- Glow flare -->
  <ellipse cx="32" cy="25" rx="4" ry="2.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.5"/>
  <!-- Neck -->
  <rect x="36" y="36" width="8" height="10" rx="3" fill="#0ea5e9"/>
  <!-- Wing hints -->
  <ellipse cx="16" cy="48" rx="6" ry="10" fill="#0369a1" opacity="0.6"/>
  <ellipse cx="64" cy="48" rx="6" ry="10" fill="#0369a1" opacity="0.6"/>
</svg>
