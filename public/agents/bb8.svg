<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <rect width="80" height="80" rx="16" fill="#0a0a0a"/>
  <!-- Ball body -->
  <circle cx="40" cy="52" r="22" fill="#c2410c"/>
  <circle cx="40" cy="52" r="22" fill="none" stroke="#f97316" stroke-width="2"/>
  <!-- Ball segments -->
  <path d="M18 52 Q40 38 62 52" fill="none" stroke="#fb923c" stroke-width="2"/>
  <path d="M18 52 Q40 66 62 52" fill="none" stroke="#fb923c" stroke-width="2"/>
  <line x1="40" y1="30" x2="40" y2="74" stroke="#fb923c" stroke-width="1.5"/>
  <!-- Head dome -->
  <ellipse cx="40" cy="22" rx="13" ry="10" fill="#fbbf24"/>
  <ellipse cx="40" cy="22" rx="13" ry="10" fill="none" stroke="#fde68a" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="40" cy="21" r="5" fill="#111"/>
  <circle cx="40" cy="21" r="3" fill="#f97316"/>
  <circle cx="41" cy="20" r="1" fill="white"/>
  <!-- Antenna -->
  <line x1="40" y1="12" x2="44" y2="6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="6" r="2" fill="#fbbf24"/>
</svg>
