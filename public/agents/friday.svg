<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <rect width="80" height="80" rx="16" fill="#050a1a"/>
  <!-- Brain / sphere shape -->
  <circle cx="40" cy="34" r="22" fill="#1e1b4b"/>
  <circle cx="40" cy="34" r="22" fill="none" stroke="#818cf8" stroke-width="2"/>
  <!-- Brain folds -->
  <path d="M22 30 Q30 22 40 26 Q50 22 58 30" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20 38 Q28 46 40 42 Q52 46 60 38" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 12 Q40 26 40 42" fill="none" stroke="#6366f1" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Eyes -->
  <circle cx="32" cy="32" r="5" fill="#111"/>
  <circle cx="32" cy="32" r="3" fill="#4f46e5"/>
  <circle cx="33" cy="31" r="1" fill="white"/>
  <circle cx="48" cy="32" r="5" fill="#111"/>
  <circle cx="48" cy="32" r="3" fill="#4f46e5"/>
  <circle cx="49" cy="31" r="1" fill="white"/>
  <!-- Neural network dots -->
  <circle cx="26" cy="40" r="2" fill="#818cf8" opacity="0.7"/>
  <circle cx="54" cy="40" r="2" fill="#818cf8" opacity="0.7"/>
  <circle cx="40" cy="50" r="2" fill="#818cf8" opacity="0.5"/>
  <line x1="26" y1="40" x2="54" y2="40" stroke="#818cf8" stroke-width="0.5" opacity="0.4"/>
  <line x1="40" y1="40" x2="40" y2="50" stroke="#818cf8" stroke-width="0.5" opacity="0.4"/>
  <!-- Body base -->
  <rect x="28" y="54" width="24" height="14" rx="4" fill="#1e1b4b"/>
  <rect x="28" y="54" width="24" height="14" rx="4" fill="none" stroke="#6366f1" stroke-width="1.5"/>
</svg>
