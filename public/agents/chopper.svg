<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <rect width="80" height="80" rx="16" fill="#050a0a"/>
  <!-- Squat cylindrical body -->
  <rect x="20" y="36" width="40" height="28" rx="6" fill="#134e4a"/>
  <rect x="20" y="36" width="40" height="28" rx="6" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <!-- Domed head - offset/grumpy -->
  <ellipse cx="40" cy="28" rx="16" ry="12" fill="#0f766e"/>
  <ellipse cx="40" cy="28" rx="16" ry="12" fill="none" stroke="#5eead4" stroke-width="2"/>
  <!-- Grumpy eye/monocle -->
  <circle cx="38" cy="27" r="7" fill="#111"/>
  <circle cx="38" cy="27" r="5" fill="#14b8a6"/>
  <circle cx="36" cy="25" r="1.5" fill="white"/>
  <!-- Antenna -->
  <line x1="46" y1="18" x2="52" y2="10" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="10" r="2.5" fill="#14b8a6"/>
  <!-- Tool arm -->
  <rect x="4" y="42" width="18" height="5" rx="2.5" fill="#0f766e"/>
  <rect x="4" y="43" width="5" height="3" rx="1" fill="#2dd4bf"/>
  <!-- Legs stubby -->
  <rect x="26" y="62" width="10" height="12" rx="4" fill="#0f766e"/>
  <rect x="44" y="62" width="10" height="12" rx="4" fill="#0f766e"/>
  <!-- Chest hatch -->
  <rect x="28" y="44" width="14" height="10" rx="2" fill="#0a2a28"/>
  <rect x="30" y="46" width="10" height="2" rx="1" fill="#2dd4bf"/>
  <rect x="30" y="50" width="6" height="2" rx="1" fill="#0d9488"/>
</svg>
